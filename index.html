<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>影视资源站 - 在线观看</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127909;</text></svg>">
<style>
:root {
  --primary:#e74c3c; --primary-dark:#c0392b;
  --bg-dark:#0a0a1a; --bg-card:#141428; --bg-card-hover:#1a1a3a;
  --text-primary:#fff; --text-secondary:#8892b0; --text-muted:#4a5568;
  --border:#2d2d5e; --accent-gold:#f0c040;
  --gradient:linear-gradient(135deg,#e74c3c 0%,#8e44ad 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;overflow-x:hidden}

/* ===== Short Drama ===== */
.drama-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:0 1rem}
.drama-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:all .2s}
.drama-card:hover{background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.drama-card h3{font-size:.95rem;margin-bottom:.4rem;color:var(--text-primary)}
.drama-card .time{font-size:.8rem;color:var(--text-muted)}
.drama-card .link{display:inline-block;margin-top:.5rem;padding:.3rem .8rem;background:var(--gradient);color:#fff;border-radius:6px;font-size:.8rem;text-decoration:none}
.drama-tabs{display:flex;gap:.5rem;padding:0 1rem;margin-bottom:1rem;flex-wrap:wrap}
.drama-tab{padding:.4rem 1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;color:var(--text-secondary);cursor:pointer;font-size:.85rem;transition:all .2s}
.drama-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.drama-search{display:flex;gap:.5rem;padding:0 1rem;margin-bottom:1rem;max-width:500px}
.drama-search input{flex:1;padding:.5rem .8rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:.9rem}
.drama-search input::placeholder{color:var(--text-muted)}
.drama-search button{padding:.5rem 1rem;background:var(--gradient);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem}

/* ===== Toolbox ===== */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;padding:0 1rem}
.tool-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;transition:all .2s}
.tool-card:hover{background:var(--bg-card-hover)}
.tool-card h3{font-size:1.1rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
.tool-card h3 .icon{width:28px;height:28px;background:var(--gradient);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tool-card p{color:var(--text-secondary);font-size:.85rem;margin-bottom:1rem}
.tool-input{width:100%;padding:.6rem .8rem;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:.9rem;margin-bottom:.5rem;box-sizing:border-box}
.tool-input::placeholder{color:var(--text-muted)}
.tool-btn{padding:.5rem 1rem;background:var(--gradient);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;transition:opacity .2s}
.tool-btn:hover{opacity:.85}
.tool-btn:disabled{opacity:.5;cursor:not-allowed}
.tool-result{margin-top:1rem;padding:1rem;background:var(--bg-dark);border:1px solid var(--border);border-radius:8px;min-height:60px;word-break:break-all;font-size:.9rem}
.tool-result img{max-width:100%;border-radius:8px}
.tool-result a{color:var(--primary);word-break:break-all}

/* Password options */
.pwd-opts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.pwd-opt{display:flex;align-items:center;gap:.3rem;font-size:.85rem;color:var(--text-secondary)}
.pwd-opt input{accent-color:var(--primary)}

/* ===== Hot Search ===== */
.hot-list{padding:0 1rem}
.hot-item{display:flex;align-items:center;padding:.7rem .5rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.hot-item:hover{background:var(--bg-card)}
.hot-rank{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.8rem;font-weight:700;margin-right:.8rem;flex-shrink:0}
.hot-rank.r1{background:#e74c3c;color:#fff}
.hot-rank.r2{background:#e67e22;color:#fff}
.hot-rank.r3{background:#f39c12;color:#fff}
.hot-rank.rn{background:var(--bg-card);color:var(--text-muted)}
.hot-title{flex:1;font-size:.9rem}
.hot-hot{font-size:.75rem;color:var(--primary);background:rgba(231,76,60,.1);padding:.1rem .5rem;border-radius:10px;margin-left:.5rem}
.hot-tabs{display:flex;gap:.4rem;padding:0 1rem;margin-bottom:.5rem;flex-wrap:wrap}
.hot-tab{padding:.3rem .8rem;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;color:var(--text-secondary);cursor:pointer;font-size:.8rem}
.hot-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== History Today ===== */
.history-today{padding:0 1rem}
.ht-item{padding:.7rem 0;border-bottom:1px solid var(--border)}
.ht-date{font-size:.8rem;color:var(--primary);margin-bottom:.2rem}
.ht-title{font-size:.9rem;color:var(--text-primary)}

/* Error/empty state */
.page-error{padding:2rem;text-align:center;color:var(--text-secondary)}
.page-error svg{width:48px;height:48px;margin-bottom:.5rem;opacity:.5}

/* ===== Mobile Bottom Tab Bar ===== */
.bottom-tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,10,26,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:.3rem 0 calc(.3rem + env(safe-area-inset-bottom));display:none;gap:0;justify-content:space-around}
.bottom-tabs a{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.35rem 0;color:var(--text-muted);text-decoration:none;font-size:.65rem;cursor:pointer;transition:color .2s;flex:1;-webkit-tap-highlight-color:transparent}
.bottom-tabs a svg{width:20px;height:20px}
.bottom-tabs a.active{color:var(--primary)}
.bottom-tabs a .tab-label{font-size:.6rem;max-width:3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Header ===== */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,10,26,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;gap:.5rem}
.logo{font-size:1.15rem;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;display:flex;align-items:center;gap:.3rem;flex-shrink:0;white-space:nowrap}
.logo svg{width:24px;height:24px}

/* Mobile search toggle button */
.search-toggle{display:none;background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:.4rem;.flex-shrink:0}
.search-toggle:hover{color:var(--text-primary)}
.search-toggle svg{width:22px;height:22px}

/* Search box */
.search-box{display:flex;align-items:center;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:1;max-width:400px;min-width:0;transition:all .3s}
.search-box.hidden-mobile{display:none!important}
.search-box:focus-within{border-color:var(--primary)}
.search-box input{flex:1;padding:.5rem .8rem;background:transparent;border:none;outline:none;color:var(--text-primary);font-size:.9rem;min-width:0}
.search-box input::placeholder{color:var(--text-muted)}
.search-box button{padding:.5rem .8rem;background:var(--primary);border:none;color:#fff;cursor:pointer;font-size:.85rem;transition:background .3s;flex-shrink:0}
.search-box button:hover{background:var(--primary-dark)}

/* Nav */
.nav{display:flex;gap:.2rem;align-items:center;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;-ms-overflow-style:none;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:.35rem .5rem;border-radius:6px;color:var(--text-secondary);text-decoration:none;font-size:.78rem;cursor:pointer;transition:all .3s;white-space:nowrap;flex-shrink:0}
.nav a:hover,.nav a.active{color:var(--text-primary);background:rgba(255,255,255,.08)}
.nav .nav-more{display:none}

/* Mobile nav dropdown */
.nav-dropdown{display:none;position:fixed;top:56px;right:1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:.3rem;min-width:120px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:101}
.nav-dropdown.show{display:block}
.nav-dropdown a{display:block;padding:.5rem .8rem;border-radius:6px;color:var(--text-secondary);text-decoration:none;font-size:.85rem;white-space:nowrap}
.nav-dropdown a:hover{color:var(--text-primary);background:rgba(255,255,255,.08)}

.main{padding-top:56px}

/* Hero */
.hero{position:relative;height:200px;overflow:hidden;background:linear-gradient(135deg,#1a0533 0%,#0a0a2a 50%,#0a1a2a 100%)}
.hero-content{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:1.5rem 1rem;height:100%;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:1.4rem;font-weight:700;margin-bottom:.3rem}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero p{color:var(--text-secondary);font-size:.85rem;max-width:500px;line-height:1.5}

/* Sections */
.section{max-width:1200px;margin:0 auto;padding:1rem 1rem}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.section-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.section-title::before{content:'';width:4px;height:18px;background:var(--primary);border-radius:2px}
.section-clear{color:var(--text-muted);font-size:.75rem;cursor:pointer;border:none;background:none;padding:.2rem .4rem;border-radius:4px;transition:all .3s}
.section-clear:hover{color:var(--primary);background:rgba(255,255,255,.05)}

/* Video grid */
.video-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem}
.video-card{background:var(--bg-card);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .3s;border:1px solid transparent}
.video-card:hover{transform:translateY(-4px);border-color:var(--border);background:var(--bg-card-hover)}
.video-card .poster{position:relative;width:100%;padding-top:140%;overflow:hidden;background:var(--border)}
.video-card .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.video-card:hover .poster img{transform:scale(1.05)}
.video-card .badge{position:absolute;top:6px;left:6px;background:var(--primary);color:#fff;padding:2px 5px;border-radius:4px;font-size:.65rem;font-weight:600}
.video-card .note{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.75);color:var(--accent-gold);padding:2px 5px;border-radius:4px;font-size:.65rem}
.video-card .info{padding:.5rem .6rem}
.video-card .info h3{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.2rem}
.video-card .info .meta{display:flex;gap:.4rem;color:var(--text-muted);font-size:.7rem}

/* History card */
.history-card .poster .progress-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--primary);border-radius:0 2px 0 0;transition:width .3s}
.history-card .poster .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:rgba(231,76,60,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.history-card:hover .poster .play-icon{opacity:1}
.history-card .info .ep-info{color:var(--primary);font-size:.7rem;font-weight:600;margin-top:.1rem}
.history-card .info .time-info{color:var(--text-muted);font-size:.65rem;margin-top:.05rem}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.filter-tag{padding:.3rem .7rem;border-radius:6px;background:var(--bg-card);color:var(--text-secondary);font-size:.8rem;cursor:pointer;border:1px solid transparent;transition:all .3s}
.filter-tag:hover{color:var(--text-primary);border-color:var(--border)}
.filter-tag.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:.5rem;margin-top:1.5rem;padding:1rem 0}
.pagination button{padding:.45rem .9rem;border-radius:6px;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);cursor:pointer;font-size:.82rem;transition:all .3s}
.pagination button:hover{border-color:var(--primary);color:var(--primary)}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* Continue section */
.continue-section{max-width:1200px;margin:0 auto;padding:0 1rem 1rem}
.continue-section.hidden{display:none}

/* Detail overlay */
.detail-overlay{position:fixed;inset:0;z-index:200;background:var(--bg-dark);overflow-y:auto;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.detail-header{position:relative;min-height:auto}
.detail-header-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.25)}
.detail-header-content{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:1.5rem 1rem;display:flex;gap:1.5rem;align-items:flex-start;flex-wrap:wrap}
.detail-poster{width:140px;height:200px;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-info{flex:1;min-width:200px}
.detail-info h1{font-size:1.4rem;font-weight:700;margin-bottom:.4rem}
.detail-info .tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.detail-info .tags span{padding:.15rem .5rem;border-radius:4px;background:rgba(255,255,255,.1);font-size:.75rem;color:var(--text-secondary)}
.detail-info .desc{color:var(--text-secondary);font-size:.85rem;line-height:1.6;max-height:80px;overflow:hidden}
.detail-resume{display:inline-flex;align-items:center;gap:.4rem;margin-top:.6rem;padding:.45rem 1rem;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:background .3s}
.detail-resume:hover{background:var(--primary-dark)}
.detail-resume.hidden{display:none}
.detail-resume svg{width:14px;height:14px}

/* Player */
.player-section{max-width:1200px;margin:0 auto;padding:1rem}
.player-container{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;margin-bottom:1rem}
.player-container video,.player-container iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.episode-list{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 0}
.episode-btn{padding:.4rem .8rem;border-radius:6px;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);cursor:pointer;font-size:.8rem;transition:all .3s;min-width:54px;text-align:center}
.episode-btn:hover{border-color:var(--primary);color:var(--primary)}
.episode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Back button */
.back-btn{position:fixed;top:70px;left:1rem;z-index:210;width:36px;height:36px;border-radius:50%;background:rgba(10,10,26,.85);border:1px solid var(--border);color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;font-size:1.1rem}
.back-btn:hover{background:var(--primary);border-color:var(--primary)}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty svg{width:48px;height:48px;margin-bottom:1rem;opacity:.5}
.empty p{margin-top:.8rem;font-size:.9rem}

/* Footer */
.footer{text-align:center;padding:1.5rem 1rem;color:var(--text-muted);font-size:.75rem;border-top:1px solid var(--border);margin-top:1.5rem}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg-dark)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Skeleton loading */
.skeleton{background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(231,76,60,.95);color:#fff;padding:.5rem 1.2rem;border-radius:8px;font-size:.85rem;z-index:999;animation:toastIn .3s;max-width:90vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Loading bar */
.loading-bar{position:fixed;top:56px;left:0;right:0;height:3px;z-index:150;background:var(--border);display:none}
.loading-bar .bar{height:100%;background:var(--gradient);width:0;animation:loadBar 1.5s ease-in-out infinite}
@keyframes loadBar{0%{width:0;margin-left:0}50%{width:60%}100%{width:0;margin-left:100%}}

/* ===== Responsive ===== */
@media(max-width:1200px){
  .video-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:900px){
  .video-grid{grid-template-columns:repeat(3,1fr)}
  .search-box{max-width:200px}
}
@media(max-width:600px){
  .header{padding:0 .6rem;gap:.3rem;height:50px}
  .logo{font-size:1rem}
  .logo svg{width:20px;height:20px}
  /* Show search toggle, hide search box by default on mobile */
  .search-toggle{display:flex!important;align-items:center;justify-content:center}
  .search-box{max-width:100%;width:100%}
  .search-box.hidden-mobile{display:none!important}
  .search-box.visible-mobile{display:flex!important;position:fixed;top:50px;left:0;right:0;z-index:102;margin:0;border-radius:0;padding:.3rem .6rem;background:rgba(10,10,26,.98);border-bottom:1px solid var(--border)}
  .nav{display:none}
  .nav-dropdown{display:none}
  .bottom-tabs{display:flex!important}
  .main{padding-top:50px;padding-bottom:56px}
  .hero{height:140px}
  .hero h1{font-size:1.1rem}
  .hero p{font-size:.78rem}
  .section,.continue-section{padding-left:.6rem;padding-right:.6rem}
  .video-grid{grid-template-columns:repeat(2,1fr);gap:.5rem}
  .video-card .info h3{font-size:.75rem}
  .detail-header-content{padding:1rem .6rem;gap:1rem}
  .detail-poster{width:100px;height:145px}
  .detail-info h1{font-size:1.1rem}
  .player-section{padding:.6rem}
  .episode-btn{padding:.3rem .6rem;font-size:.75rem;min-width:46px}
  .back-btn{top:60px;left:.5rem;width:32px;height:32px;font-size:1rem}
  .toast{top:60px;font-size:.8rem}
  .loading-bar{top:50px}
  .bottom-tabs{bottom:0}
}
@media(max-width:380px){
  .video-grid{grid-template-columns:repeat(2,1fr);gap:.4rem}
  .logo{font-size:.88rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="goHome()">
    <svg viewBox="0 0 28 28" fill="none"><rect x="1" y="5" width="26" height="18" rx="3" stroke="url(#lg)" stroke-width="2"/><polygon points="11,9 11,19 20,14" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#e74c3c"/><stop offset="1" stop-color="#8e44ad"/></linearGradient></defs></svg>
    影视
  </div>

  <!-- Search toggle for mobile -->
  <button class="search-toggle" id="searchToggle" onclick="toggleSearch()" aria-label="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>

  <!-- Search box -->
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="搜索影视..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>

  <nav class="nav" id="mainNav">
    <a href="javascript:void(0)" class="nav-home active" onclick="goHome()">首页</a>
    <a href="javascript:void(0)" class="nav-history" onclick="goHistory(this)">历史</a>
    <a href="javascript:void(0)" onclick="goShortDrama(this)">短剧</a>
    <a href="javascript:void(0)" onclick="goCategory('电影',this)">电影</a>
    <a href="javascript:void(0)" onclick="goCategory('电视剧',this)">电视剧</a>
    <a href="javascript:void(0)" onclick="goCategory('动漫',this)">动漫</a>
    <a href="javascript:void(0)" onclick="goCategory('综艺',this)">综艺</a>
    <a href="javascript:void(0)" onclick="goTools(this)">工具</a>
    <a href="javascript:void(0)" class="nav-more" onclick="toggleNavDropdown(event)" style="display:none">更多 ▾</a>
  </nav>
</header>

<!-- Nav dropdown for mobile -->
<div class="nav-dropdown" id="navDropdown">
  <a href="javascript:void(0)" onclick="goShortDrama(this);closeNavDropdown()">短剧</a>

<script>
(function(){
'use strict';

// ===== Mobile UI helpers =====
var mobileSearchOpen = false;

function toggleNavDropdown(e) {

// Show/hide mobile search toggle based on screen size
function updateMobileUI() {

window.addEventListener('resize', updateMobileUI);
// ===== End Mobile UI helpers =====

// ===== Config =====
var API_BASE = 'https://api.apibdzy.com/api.php/provide/vod/';

var SAVE_INTERVAL = 5000;

// Slimmed-down category map: only the main sub-categories per group

var state = {
  page:1, filter:'', search:'', detailData:null, hls:null, loading:false,

// ===== API via CORS Proxy =====
// Use multiple proxies, race them (first response wins = fastest)
function showLoading(show) {
  document.getElementById('loadingBar').style.display = show ? 'block' : 'none';
}

function fetchJsonWithTimeout(url, ms) {
  ms = ms || 8000;
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, ms);
  return fetch(url, { signal: ctrl.signal })
    .then(function(r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .catch(function(e) {
      clearTimeout(timer);
      throw e;
    });
}

// Sequential proxy fallback: codetabs (most reliable) -> allorigins -> direct
var CORS_PROXIES = [
  'https://api.codetabs.com/v1/proxy/?quest=',
  'https://api.allorigins.win/raw?url='
];

function fetchWithProxy(url) {
  return new Promise(function(resolve, reject) {
    var idx = 0;
    function tryNext() {
      if (idx >= CORS_PROXIES.length) {
        // All proxies failed, try direct as last resort
        fetchJsonWithTimeout(url, 8000)
          .then(resolve)
          .catch(function(e) {
            console.error('[API] All proxies + direct failed for:', url);
            reject(new Error('网络请求失败，请检查网络或稍后重试'));
          });
        return;
      }
      var proxyUrl = CORS_PROXIES[idx] + encodeURIComponent(url);
      console.log('[API] Trying proxy #' + idx + ':', CORS_PROXIES[idx].split('/')[2]);
      fetchJsonWithTimeout(proxyUrl, 12000)
        .then(function(data) {
          if (data && data.code !== undefined) {
            console.log('[API] Proxy #' + idx + ' succeeded');
            resolve(data);
          } else {
            // Bad response format, try next
            idx++;
            tryNext();
          }
        })
        .catch(function(err) {
          console.warn('[API] Proxy #' + idx + ' failed:', err.message);
          idx++;
          tryNext();
        });
    }
    tryNext();
  });
}

function buildApiUrl(params) {
  var q = [];
  for (var k in params) {
    if (params.hasOwnProperty(k) && params[k]) {
      q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
  }
  return API_BASE + '?' + q.join('&');
}

function fetchApi(params) {
  return fetchWithProxy(buildApiUrl(params));
}

function fetchM3u8Content(url) {
  return fetchWithProxy(url).catch(function() {
    return fetch(url).then(function(r) { return r.text(); });
  });
}

function normalizeVideoList(data) {
  if (!data || data.code !== 1) return { code: 0, list: [], pagecount: 0, total: 0 };
  if (data.class) {
    for (var i = 0; i < data.class.length; i++) {
      var c = data.class[i];
      if (c.type_id && c.type_name) state.typeNames[String(c.type_id)] = c.type_name;
    }
  }
  var list = (data.list || []).map(function(v) {
    return {
      vod_id: v.vod_id || '',
      vod_name: v.vod_name || '',
      type_name: v.type_name || state.typeNames[String(v.type_id)] || '',
      vod_pic: v.vod_pic || '',
      vod_year: v.vod_year || '',
      vod_area: v.vod_area || '',
      vod_remarks: v.vod_remarks || '',
      vod_lang: v.vod_lang || '',
      vod_actor: v.vod_actor || '',
      vod_director: v.vod_director || '',
      vod_content: v.vod_content || v.vod_blurb || '',
      type_id: v.type_id || ''
    };
  });
  return {
    code: 1,
    list: list,
    pagecount: data.pagecount || 0,
    total: data.total || list.length
  };
}

function normalizeDetail(v) {
  return {
    vod_id: v.vod_id || '',
    vod_name: v.vod_name || '',
    type_name: v.type_name || state.typeNames[String(v.type_id)] || '',
    vod_pic: v.vod_pic || '',
    vod_year: v.vod_year || '',
    vod_area: v.vod_area || '',
    vod_remarks: v.vod_remarks || '',
    vod_lang: v.vod_lang || '',
    vod_actor: v.vod_actor || '',
    vod_director: v.vod_director || '',
    vod_content: v.vod_content || v.vod_blurb || '',
    vod_play_url: v.vod_play_url || '',
    vod_play_from: v.vod_play_from || ''
  };
}

// ===== API logic =====
function apiHome(pg) {
  return fetchApi({ ac: 'videolist', pg: pg || 1, pagesize: 20 }).then(normalizeVideoList);
}

// Parallel fetch with error tolerance
function fetchAllParallel(urls) {
  return Promise.all(urls.map(function(u) {
    return fetchWithProxy(u).catch(function(e) { console.warn('[Fetch] Failed:', e.message); return null; });
  }));
}

function apiList(t, pg) {
  if (!t) return apiHome(pg);
  var subIds = CAT_MAP[t];
  if (subIds) {
    var cacheKey = t + '_pg' + (pg || 1);
    if (state.catPageCache[cacheKey]) {
      return Promise.resolve(state.catPageCache[cacheKey]);
    }
    var urls = subIds.map(function(id) { return buildApiUrl({ ac: 'videolist', t: id, pg: 1, pagesize: 10 }); });
    return fetchAllParallel(urls).then(function(results) {
      var all = [];
      var total = 0;
      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        if (r && r.code === 1) {
          var norm = normalizeVideoList(r);
          all = all.concat(norm.list);
          total += r.total || 0;
        }
      }
      var seen = {};
      all = all.filter(function(v) {
        if (seen[v.vod_id]) return false;
        seen[v.vod_id] = true;
        return true;
      });
      all.sort(function(a, b) { return (b.vod_id || 0) - (a.vod_id || 0); });
      var limit = 20;
      var start = ((pg || 1) - 1) * limit;
      var pageItems = all.slice(start, start + limit);
      var pagecount = Math.max(1, Math.ceil(all.length / limit));
      var result = { code: 1, list: pageItems, pagecount: pagecount, total: all.length };
      state.catPageCache[cacheKey] = result;
      return result;
    });
  }
  return fetchApi({ ac: 'videolist', t: t, pg: pg || 1, pagesize: 20 }).then(normalizeVideoList);
}

function apiSearch(wd, pg) {
  return fetchApi({ ac: 'list', wd: wd, pg: pg || 1, pagesize: 20 }).then(normalizeVideoList);
}

function apiDetail(ids) {
  return fetchApi({ ac: 'detail', ids: ids }).then(function(data) {
    if (!data || data.code !== 1 || !data.list || !data.list[0]) return { code: 0, list: [] };
    return { code: 1, list: [normalizeDetail(data.list[0])] };
  });
}

// ===== History Module =====
function getHistory() {
  try { var d = localStorage.getItem(HISTORY_KEY); return d ? JSON.parse(d) : []; }
  catch(e) { return []; }
}
function saveHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, MAX_HISTORY))); }
  catch(e) {}
}
function addOrUpdateHistory(item) {
  var idStr = String(item.vod_id || '');
  var list = getHistory().filter(function(h) { return String(h.vod_id) !== idStr; });
  item.vod_id = idStr;
  item.timestamp = Date.now();
  list.unshift(item);
  saveHistory(list);
  renderContinueSection();
}
function removeFromHistory(vodId) {
  var idStr = String(vodId);
  saveHistory(getHistory().filter(function(h) { return String(h.vod_id) !== idStr; }));
  renderContinueSection();
}
function getHistoryForVideo(vodId) {
  var idStr = String(vodId);
  return getHistory().find(function(h) { return String(h.vod_id) === idStr; });
}
function clearAllHistory() {
  if (!confirm('确定要清除所有播放记录吗？')) return;
  saveHistory([]);
  renderContinueSection();
  showToast('播放记录已清除');
}
function formatTime(sec) {
  if (!sec || sec < 0 || isNaN(sec)) return '00:00';
  var m = Math.floor(sec / 60), s = Math.floor(sec % 60), h = Math.floor(m / 60);
  if (h > 0) { m = m % 60; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function formatRelativeTime(ts) {
  if (!ts) return '';
  var d = Date.now() - ts, mins = Math.floor(d/60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  var hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + '小时前';
  var days = Math.floor(hrs/24);
  if (days < 30) return days + '天前';
  return new Date(ts).toLocaleDateString();
}

// ===== Render Continue Section =====
function renderContinueSection() {
  var section = document.getElementById('continueSection');
  var grid = document.getElementById('continueGrid');
  var history = getHistory();
  if (!history.length || state.search || state.filter) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');
  grid.innerHTML = history.slice(0, 10).map(function(h) {
    var fc = (h.vod_name||'').charAt(0);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><rect fill="%2322255a" width="200" height="280"/><text x="50%" y="50%" fill="%23555" text-anchor="middle" dy=".3em" font-size="40">' + esc(fc) + '</text></svg>';
    var ph = 'data:image/svg+xml,' + svg;
    var pct = (h.duration>0 && h.progress>0) ? Math.min(100,(h.progress/h.duration)*100) : 0;
    return '<div class="video-card history-card" data-id="'+esc(h.vod_id)+'" onclick="openDetailAndResume(this.dataset.id)">'
      +'<div class="poster">'
        +'<img src="'+esc(h.vod_pic||ph)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+ph+'\'">'
        +(h.type_name?'<span class="badge">'+esc(h.type_name)+'</span>':'')
        +'<div class="progress-bar" style="width:'+pct.toFixed(1)+'%"></div>'
        +'<div class="play-icon"><svg viewBox="0 0 24 24" fill="#fff" width="18" height="18"><polygon points="6,3 20,12 6,21"/></svg></div>'
      +'</div>'
      +'<div class="info">'
        +'<h3>'+esc(h.vod_name)+'</h3>'
        +(h.episode_name?'<div class="ep-info">'+esc(h.episode_name)+'</div>':'')
        +'<div class="time-info">'
          +(h.duration>0&&h.progress>0?formatTime(h.progress)+' / '+formatTime(h.duration)+' · ':'')
          +formatRelativeTime(h.timestamp)
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}

// ===== Save Progress =====
function startProgressSave() {
  stopProgressSave();
  state.saveTimer = setInterval(doSaveProgress, SAVE_INTERVAL);
}
function stopProgressSave() {
  if (state.saveTimer) { clearInterval(state.saveTimer); state.saveTimer = null; }
}
function doSaveProgress() {
  var video = document.getElementById('videoPlayer');
  if (!video || !state.detailData) return;
  var ct = video.currentTime || 0, dur = video.duration || 0;
  if (ct < PROGRESS_THRESHOLD) return;
  var activeBtn = document.querySelector('.episode-btn.active');
  if (!activeBtn) return;
  var btns = document.querySelectorAll('.episode-btn');
  var epIdx = Array.prototype.indexOf.call(btns, activeBtn);
  console.log('[History] Saving:', state.detailData.vod_id, activeBtn.textContent, formatTime(ct)+'/'+formatTime(dur));
  addOrUpdateHistory({
    vod_id: state.detailData.vod_id,
    vod_name: state.detailData.vod_name,
    vod_pic: state.detailData.vod_pic,
    type_name: state.detailData.type_name,
    vod_remarks: state.detailData.vod_remarks,
    episode_idx: epIdx,
    episode_name: activeBtn.textContent,
    progress: ct,
    duration: dur
  });
}
function saveProgressNow() { doSaveProgress(); }

// ===== Resume =====
function resumePlayback() {
  if (!state.pendingResume) return;
  var r = state.pendingResume;
  state.pendingResume = null;
  document.getElementById('resumeBtn').classList.add('hidden');
  playEpisode(r.episodeIdx, r.progress);
}

// ===== Helpers =====
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderVideoGrid(videos) {
  var grid = document.getElementById('videoGrid');
  if (!videos || !videos.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><p>暂无内容</p></div>';
    return;
  }
  grid.innerHTML = videos.map(function(v) {
    var fc = (v.vod_name||'').charAt(0);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><rect fill="%2322255a" width="200" height="280"/><text x="50%" y="50%" fill="%23555" text-anchor="middle" dy=".3em" font-size="40">' + esc(fc) + '</text></svg>';
    var ph = 'data:image/svg+xml,' + svg;
    var hasPic = !!(v.vod_pic && v.vod_pic.trim());
    return '<div class="video-card" data-id="'+esc(v.vod_id)+'" '+(hasPic?'':'data-needs-cover="1"')+' onclick="openDetailById(this.dataset.id)">'
      +'<div class="poster">'
        +'<img src="'+esc(v.vod_pic||ph)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+ph+'\'">'
        +(v.type_name?'<span class="badge">'+esc(v.type_name)+'</span>':'')
        +(v.vod_remarks?'<span class="note">'+esc(v.vod_remarks)+'</span>':'')
      +'</div>'
      +'<div class="info">'
        +'<h3>'+esc(v.vod_name)+'</h3>'
        +'<div class="meta">'
          +(v.vod_year?'<span>'+esc(v.vod_year)+'</span>':'')
          +(v.vod_area?'<span>'+esc(v.vod_area)+'</span>':'')
        +'</div>'
      +'</div>'
    +'</div>';
  }).join('');

  // Lazy cover loading
  lazyLoadCovers(grid);
}

// Lazy cover loader
var coverCache = {};
var coverObserver = null;
function initCoverObserver() {
  if (coverObserver) coverObserver.disconnect();
  coverObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var card = entry.target;
        var img = card.querySelector('img');
        var vodId = card.dataset.id;
        if (!vodId || !img) return;
        if (coverCache[vodId]) { img.src = coverCache[vodId]; coverObserver.unobserve(card); return; }
        apiDetail(vodId).then(function(data) {
          if (data && data.code === 1 && data.list && data.list[0]) {
            var pic = data.list[0].vod_pic;
            if (pic) { coverCache[vodId] = pic; img.src = pic; }
          }
        }).catch(function(){});
        coverObserver.unobserve(card);
      }
    });
  }, { rootMargin: '100px' });
}
function lazyLoadCovers(grid) {
  if (!coverObserver) initCoverObserver();
  grid.querySelectorAll('[data-needs-cover]').forEach(function(card) { coverObserver.observe(card); });
}

function renderEpisodes(playUrl) {
  var container = document.getElementById('episodeList');
  if (!playUrl) { container.innerHTML = '<p style="color:var(--text-muted)">暂无播放资源</p>'; return; }
  var sep = playUrl.indexOf('#') > -1 ? '#' : '$$$';
  var episodes = playUrl.split(sep).filter(function(s){return s.trim();}).map(function(s) {
    var idx = s.indexOf('$');
    return idx > -1 ? { name: s.substring(0, idx), url: s.substring(idx+1) } : { name: '播放', url: s };
  }).filter(function(e){return e.url;});
  state.currentEpisodes = episodes;
  if (!episodes.length) { container.innerHTML = '<p style="color:var(--text-muted)">暂无播放资源</p>'; return; }
  container.innerHTML = episodes.map(function(ep, i) {
    return '<button class="episode-btn" data-idx="'+i+'" data-url="'+esc(ep.url)+'" onclick="playEpisode('+i+')">'+esc(ep.name)+'</button>';
  }).join('');
}

function playEpisode(index, seekTo) {
  var btns = document.querySelectorAll('.episode-btn');
  if (!btns[index]) return;
  btns.forEach(function(b){b.classList.remove('active');});
  btns[index].classList.add('active');
  state.currentEpisodeIdx = index;

  var url = btns[index].dataset.url;
  if (!url) return;

  var container = document.getElementById('playerContainer');
  container.innerHTML = '<video id="videoPlayer" controls crossorigin="anonymous" playsinline></video>';
  var video = document.getElementById('videoPlayer');

  if (state.seekCleanup) { state.seekCleanup(); state.seekCleanup = null; }
  if (state.hls) { state.hls.destroy(); state.hls = null; }

  var isM3u8 = /\.m3u8/i.test(url);
  var playUrl = url;

  var seekTarget = (typeof seekTo === 'number' && seekTo > 0) ? seekTo : 0;
  var hasSeeked = false;

  function cleanupSeekListeners() {
    video.removeEventListener('loadedmetadata', onLoaded);
    video.removeEventListener('durationchange', onDuration);
    video.removeEventListener('canplay', onCanPlay);
    video.removeEventListener('timeupdate', onTimeUpdate);
  }

  function doSeek() {
    if (hasSeeked || seekTarget <= 0) return;
    var seekable = video.seekable;
    if (seekable && seekable.length > 0) {
      var start = seekable.start(0), end = seekable.end(0);
      if (seekTarget >= start && seekTarget <= end) {
        video.currentTime = seekTarget; hasSeeked = true; cleanupSeekListeners(); return;
      }
    }
    if (video.duration > 0 && seekTarget < video.duration) {
      video.currentTime = seekTarget; hasSeeked = true; cleanupSeekListeners(); return;
    }
  }

  function onLoaded() { doSeek(); }
  function onDuration() { doSeek(); }
  function onCanPlay() { doSeek(); }
  function onTimeUpdate() {
    if (!hasSeeked && seekTarget > 0 && video.currentTime < 2) doSeek();
  }

  video.addEventListener('loadedmetadata', onLoaded);
  video.addEventListener('durationchange', onDuration);
  video.addEventListener('canplay', onCanPlay);
  video.addEventListener('timeupdate', onTimeUpdate);
  state.seekCleanup = cleanupSeekListeners;

  if (isM3u8 && typeof Hls !== 'undefined' && Hls.isSupported()) {
    state.hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60 });
    state.hls.loadSource(playUrl);
    state.hls.attachMedia(video);
    state.hls.on(Hls.Events.MANIFEST_PARSED, function() {
      console.log('[HLS] Manifest parsed, duration:', video.duration);
      video.play().catch(function(){});
      doSeek();
    });
    state.hls.on(Hls.Events.ERROR, function(_, data) {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) state.hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) state.hls.recoverMediaError();
        else fallbackIframe(container, url);
      }
    });
  } else if (isM3u8 && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = playUrl;
    video.addEventListener('loadedmetadata', function(){ video.play().catch(function(){}); doSeek(); });
  } else if (/\.(mp4|webm)$/i.test(url)) {
    video.src = playUrl;
    video.addEventListener('loadedmetadata', function(){ doSeek(); video.play().catch(function(){}); });
  } else {
    fallbackIframe(container, url);
  }

  startProgressSave();
  document.getElementById('resumeBtn').classList.add('hidden');
  state.pendingResume = null;
}

function fallbackIframe(container, url) {
  container.innerHTML = '<iframe src="'+esc(url)+'" allowfullscreen allow="autoplay;fullscreen;encrypted-media;picture-in-picture"></iframe>';
  stopProgressSave();
}

(function blockAds() {
  // Override window.open to block popup ads, but preserve return value
  var _origOpen = window.open;
  window.open = function(url, target, features) {
    // Allow same-window navigation and named targets (common in video players)
    if (target === '_self' || (target && target !== '_blank')) {
      return _origOpen.apply(this, arguments);
    }
    console.log('[AdBlock] Blocked popup:', url);
    return null;
  };
})();

// ===== Hot Search =====
function loadHotSearch(tag, el) {
  hotTagState = tag;
  document.querySelectorAll('.hot-tab').forEach(function(t){t.classList.remove('active');});
  if (el) el.classList.add('active');
  var list = document.getElementById('hotList');
  list.innerHTML = '<div class="empty"><p>加载中...</p></div>';
  fetch(KULEU_API + '/vtquark?tag=' + encodeURIComponent(tag))
    .then(function(r){ return r.json(); })
    .then(function(res) {
      if (res.code === 200 && res.data && res.data.length) {
        list.innerHTML = res.data.map(function(item, i) {
          var rc = i < 1 ? 'r1' : i < 2 ? 'r2' : i < 3 ? 'r3' : 'rn';
          return '<div class="hot-item">'
            +'<span class="hot-rank '+rc+'">'+(i+1)+'</span>'
            +'<span class="hot-title">'+esc(item.title || item.name || '未知')+'</span>'
            +(item.hot ? '<span class="hot-hot">'+esc(item.hot)+'</span>' : '')
            +'</div>';
        }).join('');
      } else {
        list.innerHTML = '<div class="empty"><p>暂无热搜数据</p></div>';
      }
    })
    .catch(function(e) {
      list.innerHTML = '<div class="empty"><p>加载失败</p></div>';
    });
}

// ===== Watermark Remover =====
function doWatermark() {
  var url = (document.getElementById('wmInput').value || '').trim();
  if (!url) { showToast('请输入视频链接'); return; }
  var res = document.getElementById('wmResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">解析中...</p>';
  fetch(KULEU_API + '/jiexi?url=' + encodeURIComponent(url))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.code === 200 && data.data) {
        var d = data.data;
        var html = '<div style="margin-bottom:.5rem">';
        if (d.cover) html += '<img src="'+esc(d.cover)+'" style="max-width:200px;border-radius:8px;margin-bottom:.5rem">';
        html += '<strong>'+esc(d.title||'')+'</strong>';
        if (d.author && d.author.name) html += '<br><span style="color:var(--text-secondary);font-size:.85rem">@'+esc(d.author.name)+'</span>';
        html += '</div>';
        if (d.url) html += '<a href="'+esc(d.url)+'" target="_blank" download>下载无水印视频</a>';
        if (d.music && d.music.url) html += '<br><a href="'+esc(d.music.url)+'" target="_blank">下载背景音乐</a>';
        if (d.images && d.images.length) {
          html += '<div style="margin-top:.5rem">';
          d.images.forEach(function(img) { html += '<img src="'+esc(img)+'" style="max-width:150px;margin:.2rem;border-radius:4px">'; });
          html += '</div>';
        }
        res.innerHTML = html || '<p>解析成功但无可用内容</p>';
      } else {
        res.innerHTML = '<p>解析失败: '+(data.msg||'未知错误')+'</p>';
      }
    })
    .catch(function(e) {
      res.innerHTML = '<p>解析失败: '+esc(e.message)+'</p>';
    });
}

// ===== Password Generator =====
function doGenPwd() {
  var opts = {
    ss_xx: document.getElementById('pwdLower').checked ? '1' : '0',
    ss_dx: document.getElementById('pwdUpper').checked ? '1' : '0',
    ss_sz: document.getElementById('pwdNum').checked ? '1' : '0',
    ss_fh: document.getElementById('pwdSym').checked ? '1' : '0',
    ss_cd: Math.max(4, Math.min(64, parseInt(document.getElementById('pwdLen').value)||16)),
    ss_sl: Math.max(1, Math.min(20, parseInt(document.getElementById('pwdCount').value)||5))
  };
  if (opts.ss_xx==='0' && opts.ss_dx==='0' && opts.ss_sz==='0' && opts.ss_fh==='0') {
    showToast('请至少选择一种字符类型'); return;
  }
  var params = Object.keys(opts).map(function(k){return k+'='+opts[k];}).join('&');
  var res = document.getElementById('pwdResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">生成中...</p>';
  fetch(KULEU_API + '/suijimima?' + params)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.code === 200 && data.data && data.data.password_box) {
        res.innerHTML = data.data.password_box.map(function(pw) {
          return '<div style="padding:.3rem .5rem;background:var(--bg-card);border-radius:4px;margin-bottom:.3rem;cursor:pointer;font-family:monospace" onclick="navigator.clipboard.writeText(\''+pw.replace(/'/g,"\\'")+'\');showToast(\'已复制\')">'+esc(pw)+'</div>';
        }).join('');
      } else {
        res.innerHTML = '<p>生成失败</p>';
      }
    })
    .catch(function(e) { res.innerHTML = '<p>生成失败</p>'; });
}

// ===== QR Code Generator =====
function doGenQR() {
  var text = (document.getElementById('qrInput').value || '').trim();
  if (!text) { showToast('请输入内容'); return; }
  var res = document.getElementById('qrResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">生成中...</p>';
  var img = new Image();
  img.onload = function() {
    res.innerHTML = '';
    img.style.maxWidth = '200px';
    img.style.borderRadius = '8px';
    res.appendChild(img);
    res.innerHTML += '<br><a href="'+img.src+'" download="qrcode.png" style="font-size:.85rem;margin-top:.5rem;display:inline-block">下载二维码</a>';
  };
  img.onerror = function() { res.innerHTML = '<p>生成失败</p>'; };
  img.src = KULEU_API + '/qrcode?text=' + encodeURIComponent(text) + '&size=200&frame=1&e=L';
}

// ===== History Today =====
function loadHistoryToday() {
  var res = document.getElementById('htResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">加载中...</p>';
  fetch(KULEU_API + '/lsjt')
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.code === 200 && data.result) {
        res.innerHTML = '<div class="history-today" style="padding:0">'
          +'<div style="margin-bottom:.5rem;color:var(--primary);font-size:.85rem">'+esc(data.day||'')+'</div>'
          + data.result.map(function(item) {
            return '<div class="ht-item">'
              +'<div class="ht-date">'+esc(item.date||'')+'</div>'
              +'<div class="ht-title">'+esc(item.title||'')+'</div>'
              +'</div>';
          }).join('')
          +'</div>';
      } else {
        res.innerHTML = '<p>加载失败</p>';
      }
    })
    .catch(function(e) { res.innerHTML = '<p>加载失败</p>'; });
}

function doSugKeywords() {

  var res = document.getElementById('sugResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">拓展中...</p>';
  fetch(KULEU_API + '/sug?name=' + encodeURIComponent(name))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.code === 200 && data.data && data.data.list) {
        res.innerHTML = data.data.list.map(function(item) {
          return '<span style="display:inline-block;padding:.2rem .6rem;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin:.2rem;font-size:.85rem;cursor:pointer" onclick="document.getElementById(\'searchInput\').value=\''+esc(item.name).replace(/'/g,"\\'")+'\';goHome();doSearch()">'+esc(item.name)+'</span>';
        }).join('');
      } else {
        res.innerHTML = '<p>无拓展结果</p>';
      }
    })
    .catch(function(e) { res.innerHTML = '<p>拓展失败</p>'; });
}

// ===== ICO Favicon =====
function doGetIco() {
  var url = (document.getElementById('icoInput').value || '').trim();
  if (!url) { showToast('请输入网址'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  var res = document.getElementById('icoResult');
  res.innerHTML = '<p style="color:var(--text-secondary)">获取中...</p>';
  var icoUrl = KULEU_API + '/ico?url=' + encodeURIComponent(url);
  var img = new Image();
  img.onload = function() {
    res.innerHTML = '<img src="'+icoUrl+'" style="width:64px;height:64px;border-radius:12px;background:#fff;padding:8px;margin-bottom:.5rem"><br>'
      +'<a href="'+icoUrl+'" download="favicon.ico" style="font-size:.85rem;color:var(--primary)">下载图标</a>'
      +'<br><span style="font-size:.8rem;color:var(--text-muted);margin-top:.3rem;display:block">'+esc(url)+'</span>';
  };
  img.onerror = function() { res.innerHTML = '<p>获取失败，请检查网址是否正确</p>'; };
  img.src = icoUrl;
}

// ===== Random Video =====

        res.innerHTML = '<video src="'+esc(data.mp4_video)+'" controls autoplay loop playsinline style="width:100%;max-height:400px;border-radius:12px;background:#000"></video>'

      } else {

      }
    })
    .catch(function(e) { res.innerHTML = '<p>加载失败: '+esc(e.message)+'</p>'; });
}
